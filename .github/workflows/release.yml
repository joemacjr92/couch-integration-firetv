          APK_NAME="couch-integration-firetv-$VERSION-r0.apk"

          # Pre-create the architecture directory as the GitHub Actions runner.
          # The Docker repository builder runs as root; creating this directory
          # here preserves runner ownership so feed.json can be written afterward.
          mkdir -p "$FEED/armv7"

          # Carry forward previously published APK versions.
          if [[ -d "$GITHUB_WORKSPACE/existing-feed/preview/armv7" ]]; then
            find "$GITHUB_WORKSPACE/existing-feed/preview/armv7" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              ! -name "$APK_NAME" \
              -exec cp -n {} "$OUTPUT/" \;
          fi

          docker run --rm \
            --platform linux/arm/v7 \
            -v "$SDK:/work/sdk:ro" \
            -v "$OUTPUT:/work/packages:ro" \
            -v "$FEED:/work/repository:rw" \
            -v "$RUNNER_TEMP/apk-keys:/work/keys:ro" \
            alpine:3.24 sh -eu -c '
              mkdir -p /root/.abuild

              cp /work/keys/developer.rsa \
                /root/.abuild/-6afc809d.rsa

              cp /work/keys/developer.rsa.pub \
                /root/.abuild/-6afc809d.rsa.pub

              chmod 600 /root/.abuild/-6afc809d.rsa
              chmod 644 /root/.abuild/-6afc809d.rsa.pub

              apk add --no-cache alpine-sdk

              sh /work/sdk/tools/integrations/build-repository.sh \
                /root/.abuild/-6afc809d.rsa \
                /work/packages \
                /work/repository
            '

          INDEX="$FEED/armv7/APKINDEX.tar.gz"
          REPO_ARCH="$FEED/armv7"
          PRIVATE_KEY="$RUNNER_TEMP/apk-keys/developer.rsa"
          test -f "$INDEX"

          tar -tzf "$INDEX" | grep '^\.SIGN\.RSA\.' >/dev/null

          # Signed metadata binds the index and every published APK to this
          # repository key. Carry the sequence forward to prevent feed rollback.
          PREVIOUS="$GITHUB_WORKSPACE/existing-feed/preview/armv7/feed.json"
          SEQUENCE=1
          if [[ -f "$PREVIOUS" ]]; then
            PREVIOUS_SEQUENCE="$(jq -er '.sequence | numbers' "$PREVIOUS")"
            SEQUENCE="$((PREVIOUS_SEQUENCE + 1))"
          fi

          ISSUED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          EXPIRES="$(date -u -d '+30 days' +'%Y-%m-%dT%H:%M:%SZ')"
          INDEX_SIZE="$(stat -c '%s' "$INDEX")"
          INDEX_SHA256="$(sha256sum "$INDEX" | cut -d ' ' -f 1)"

          PACKAGES="$RUNNER_TEMP/feed-packages.json"
          : > "$PACKAGES"
          for APK in "$REPO_ARCH"/couch-integration-*.apk; do
            [[ -f "$APK" ]] || continue
            APK_NAME="$(basename "$APK")"
            APK_VERSION="${APK_NAME#couch-integration-firetv-}"
            APK_VERSION="${APK_VERSION%-r0.apk}"
            APK_SIZE="$(stat -c '%s' "$APK")"
            APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"

            jq -n \
              --arg id firetv \
              --arg version "$APK_VERSION" \
              --arg apk "$APK_NAME" \
              --argjson size "$APK_SIZE" \
              --arg sha256 "$APK_SHA256" \
              '{id:$id,version:$version,apk:$apk,size:$size,sha256:$sha256,protocol_version:3,min_core_protocol_version:3}' \
              >> "$PACKAGES"
          done

          jq -s . "$PACKAGES" > "$RUNNER_TEMP/feed-packages-array.json"
          jq -n \
            --arg channel preview \
            --argjson sequence "$SEQUENCE" \
            --arg issued "$ISSUED" \
            --arg expires "$EXPIRES" \
            --arg index_path APKINDEX.tar.gz \
            --argjson index_size "$INDEX_SIZE" \
            --arg index_sha256 "$INDEX_SHA256" \
            --slurpfile packages "$RUNNER_TEMP/feed-packages-array.json" \
            '{schema:1,channel:$channel,sequence:$sequence,issued:$issued,expires:$expires,index:{path:$index_path,size:$index_size,sha256:$index_sha256},packages:$packages[0]}' \
            > "$REPO_ARCH/feed.json"

          openssl dgst -sha256 -sign "$PRIVATE_KEY" \
            -out "$REPO_ARCH/feed.json.sig" "$REPO_ARCH/feed.json"

          echo "Signed repository index and metadata:"
          sha256sum "$INDEX" "$REPO_ARCH/feed.json" "$REPO_ARCH/feed.json.sig"
          ls -lh "$REPO_ARCH"

      - name: Publish package feed to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: couch-integration-firetv/build/repository
          destination_dir: .
          commit_message: "Publish Fire TV integration feed"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: couch-integration-firetv/build/integrations/couch-integration-firetv-${{ steps.version.outputs.version }}-r0.apk
