name: Build Fire TV Integration

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release (for example v0.1.5)
        required: true
        type: string
      dry_run:
        description: Build and validate without publishing the feed or GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: firetv-pages-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Fire TV integration
        uses: actions/checkout@v4
        with:
          path: couch-integration-firetv

      - name: Check out Fire TV workflow validation tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: firetv-workflow-tools

      - name: Check out CouchOS SDK
        uses: actions/checkout@v4
        with:
          repository: Couch-OS/couch
          ref: e7fc36cd90faa6d6b2e3e8a733c28a3fed833d81
          path: couch-sdk-reference

      - name: Check out existing package feed
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/couch-integration-firetv"
          FEED="$GITHUB_WORKSPACE/existing-feed"
          mkdir -p "$FEED"
          set +e
          REMOTE_REF="$(git -C "$SOURCE" ls-remote --heads origin refs/heads/gh-pages 2>"$RUNNER_TEMP/gh-pages-error")"
          STATUS=$?
          set -e
          if [[ "$STATUS" -ne 0 || -z "$REMOTE_REF" ]]; then
            cat "$RUNNER_TEMP/gh-pages-error" >&2 || true
            echo "Unable to confirm an existing gh-pages branch; refusing implicit feed bootstrap." >&2
            exit 1
          fi
          git -C "$SOURCE" fetch --no-tags origin refs/heads/gh-pages
          git -C "$SOURCE" archive FETCH_HEAD | tar -x -C "$FEED"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Install Zig 0.15.2
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/couch-sdk-reference"

          VERSION=0.15.2
          NAME=zig-x86_64-linux-$VERSION
          SHA=02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239

          mkdir -p build/toolchains

          curl -fsSL \
            "https://ziglang.org/download/$VERSION/$NAME.tar.xz" \
            -o "build/toolchains/$NAME.tar.xz"

          echo "$SHA  build/toolchains/$NAME.tar.xz" | sha256sum -c -

          tar -xJf "build/toolchains/$NAME.tar.xz" -C build/toolchains
          rm "build/toolchains/$NAME.tar.xz"

          echo "ZIG=$GITHUB_WORKSPACE/couch-sdk-reference/build/toolchains/$NAME/zig" >> "$GITHUB_ENV"

      - name: Prepare release version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$REQUESTED_TAG"
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release_tag: $TAG" >&2; exit 1; }
            git -C "$GITHUB_WORKSPACE/couch-integration-firetv" fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            git -C "$GITHUB_WORKSPACE/couch-integration-firetv" checkout --detach "$TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version tag: $TAG" >&2; exit 1; }
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Embed release version in source manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          PLUGIN="$GITHUB_WORKSPACE/couch-integration-firetv"
          MANIFEST="$PLUGIN/plugin.json"
          TEMP="$RUNNER_TEMP/plugin.json"

          # The executable embeds plugin.json at compile time. Set the release
          # version before compiling, then use this exact file in the APK.
          jq -e --arg version "$VERSION" '
            .version = $version
          ' "$MANIFEST" > "$TEMP"
          mv "$TEMP" "$MANIFEST"

          jq -e --arg version "$VERSION" '
            .id == "firetv" and
            .version == $version and
            .executable == "bin/couch-plugin-firetv" and
            .protocol_version == 3 and
            .min_core_protocol_version == 3
          ' "$MANIFEST" >/dev/null

      - name: Test executable admission handshake
        shell: bash
        run: |
          set -euo pipefail

          SDK="$GITHUB_WORKSPACE/couch-sdk-reference"
          PLUGIN="$GITHUB_WORKSPACE/couch-integration-firetv"

          # Start the compiled executable through Couch's real package host.
          # This catches embedded/package manifest mismatches before cross-build.
          cd "$SDK/clients"
          cargo test --locked \
            --manifest-path "$PLUGIN/Cargo.toml" \
            --test admission -- --ignored

      - name: Build ARMv7 binary
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/couch-sdk-reference"

          source tools/arm-cc-env.sh

          cd clients

          cargo build \
            --release \
            --locked \
            --target armv7-unknown-linux-musleabihf \
            --manifest-path "$GITHUB_WORKSPACE/couch-integration-firetv/Cargo.toml"

      - name: Prepare signing keys
        shell: bash
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          APK_PUBLIC_KEY: ${{ secrets.APK_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          test -n "$APK_PRIVATE_KEY"
          test -n "$APK_PUBLIC_KEY"

          install -d -m 700 "$RUNNER_TEMP/apk-keys"

          printf '%s\n' "$APK_PRIVATE_KEY" \
            > "$RUNNER_TEMP/apk-keys/developer.rsa"

          printf '%s\n' "$APK_PUBLIC_KEY" \
            > "$RUNNER_TEMP/apk-keys/developer.rsa.pub"

          chmod 600 "$RUNNER_TEMP/apk-keys/developer.rsa"
          chmod 644 "$RUNNER_TEMP/apk-keys/developer.rsa.pub"

          PRIVATE_DER_SHA256="$(openssl pkey -in "$RUNNER_TEMP/apk-keys/developer.rsa" -pubout -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          SECRET_PUBLIC_DER_SHA256="$(openssl pkey -pubin -in "$RUNNER_TEMP/apk-keys/developer.rsa.pub" -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          REPOSITORY_PUBLIC_DER_SHA256="$(openssl pkey -pubin -in "$GITHUB_WORKSPACE/firetv-workflow-tools/keys/firetv-repository-public.pem" -outform DER 2>/dev/null | sha256sum | awk '{print $1}')"
          test "$PRIVATE_DER_SHA256" = "$SECRET_PUBLIC_DER_SHA256"
          test "$SECRET_PUBLIC_DER_SHA256" = "$REPOSITORY_PUBLIC_DER_SHA256"

      - name: Validate existing signed feed history
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VALIDATOR=("$GITHUB_WORKSPACE/firetv-workflow-tools/tools/validate-feed-history.sh"
            "$GITHUB_WORKSPACE/existing-feed/preview/armv7"
            "$GITHUB_WORKSPACE/firetv-workflow-tools/keys/firetv-repository-public.pem"
            "$VERSION")
          # Rebuilding an already-published version is allowed only in an
          # explicit manual dry run. All publication paths remain strict.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            VALIDATOR+=(--allow-existing-version)
          fi
          bash "${VALIDATOR[@]}"

      - name: Build and sign ARMv7 APK
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          PLUGIN="$GITHUB_WORKSPACE/couch-integration-firetv"
          SDK="$GITHUB_WORKSPACE/couch-sdk-reference"
          OUTPUT="$PLUGIN/build/integrations"

          mkdir -p "$OUTPUT"

          docker run --rm \
            --platform linux/arm/v7 \
            -v "$SDK:/work/sdk:ro" \
            -v "$PLUGIN:/work/plugin:ro" \
            -v "$RUNNER_TEMP:/work/tmp:rw" \
            -v "$OUTPUT:/work/out:rw" \
            -v "$RUNNER_TEMP/apk-keys:/work/keys:ro" \
            -e VERSION="$VERSION" \
            alpine:3.24 sh -eu -c '
              mkdir -p /root/.abuild

              cp /work/keys/developer.rsa \
                /root/.abuild/-6afc809d.rsa

              cp /work/keys/developer.rsa.pub \
                /root/.abuild/-6afc809d.rsa.pub

              chmod 600 /root/.abuild/-6afc809d.rsa
              chmod 644 /root/.abuild/-6afc809d.rsa.pub

              apk add --no-cache alpine-sdk jq binutils

              cp /root/.abuild/-6afc809d.rsa.pub /etc/apk/keys/

              sh /work/sdk/tools/integrations/build-apk.sh \
                firetv \
                "$VERSION" \
                /work/plugin/target/armv7-unknown-linux-musleabihf/release/couch-plugin-firetv \
                /work/plugin/plugin.json \
                /root/.abuild/-6afc809d.rsa \
                /work/out

              apk --keys-dir /etc/apk/keys verify \
                "/work/out/couch-integration-firetv-$VERSION-r0.apk"
            '

          APK="$OUTPUT/couch-integration-firetv-$VERSION-r0.apk"

          test -f "$APK"

          APK_ENTRIES="$(tar -tzf "$APK")"
          printf '%s\n' "$APK_ENTRIES" | grep '^\.SIGN\.RSA\.' >/dev/null

          # Inspect the actual APK payload, not only the source tree. Require
          # the packaged manifest and executable to be byte-for-byte identical
          # to the inputs used for the host handshake and ARM cross-build.
          MANIFEST_ENTRY="usr/lib/couch/integrations/firetv/manifest.json"
          BINARY_ENTRY="usr/lib/couch/integrations/firetv/bin/couch-plugin-firetv"
          printf '%s\n' "$APK_ENTRIES" | grep -Fx "$MANIFEST_ENTRY" >/dev/null
          printf '%s\n' "$APK_ENTRIES" | grep -Fx "$BINARY_ENTRY" >/dev/null
          tar -xOf "$APK" "$MANIFEST_ENTRY" > "$RUNNER_TEMP/apk-manifest.json"
          tar -xOf "$APK" "$BINARY_ENTRY" > "$RUNNER_TEMP/apk-binary"
          cmp "$PLUGIN/plugin.json" "$RUNNER_TEMP/apk-manifest.json"
          cmp "$PLUGIN/target/armv7-unknown-linux-musleabihf/release/couch-plugin-firetv" "$RUNNER_TEMP/apk-binary"

          echo "APK successfully built and signed:"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Build and sign package repository
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          PLUGIN="$GITHUB_WORKSPACE/couch-integration-firetv"
          SDK="$GITHUB_WORKSPACE/couch-sdk-reference"
          OUTPUT="$PLUGIN/build/integrations"
          FEED="$PLUGIN/build/repository/preview"
          APK_NAME="couch-integration-firetv-$VERSION-r0.apk"

          # Pre-create the architecture directory as the GitHub Actions runner.
          # The Docker repository builder runs as root; creating this directory
          # here preserves runner ownership so feed.json can be written afterward.
          mkdir -p "$FEED/armv7"

          # Carry forward only APKs authenticated by the signed feed validator.
          if [[ -s "$RUNNER_TEMP/firetv-verified-packages.tsv" ]]; then
            while read -r _VERSION PREVIOUS_APK _SIZE _SHA256; do
              cp -n -- \
                "$GITHUB_WORKSPACE/existing-feed/preview/armv7/$PREVIOUS_APK" \
                "$OUTPUT/$PREVIOUS_APK"
            done < "$RUNNER_TEMP/firetv-verified-packages.tsv"
          fi

          docker run --rm \
            --platform linux/arm/v7 \
            -v "$SDK:/work/sdk:ro" \
            -v "$OUTPUT:/work/packages:ro" \
            -v "$FEED:/work/repository:rw" \
            -v "$RUNNER_TEMP/apk-keys:/work/keys:ro" \
            alpine:3.24 sh -eu -c '
              mkdir -p /root/.abuild

              cp /work/keys/developer.rsa \
                /root/.abuild/-6afc809d.rsa

              cp /work/keys/developer.rsa.pub \
                /root/.abuild/-6afc809d.rsa.pub

              chmod 600 /root/.abuild/-6afc809d.rsa
              chmod 644 /root/.abuild/-6afc809d.rsa.pub

              apk add --no-cache alpine-sdk
              cp /root/.abuild/-6afc809d.rsa.pub /etc/apk/keys/

              sh /work/sdk/tools/integrations/build-repository.sh \
                /root/.abuild/-6afc809d.rsa \
                /work/packages \
                /work/repository

              apk --keys-dir /etc/apk/keys verify \
                /work/repository/armv7/APKINDEX.tar.gz
            '

          INDEX="$FEED/armv7/APKINDEX.tar.gz"
          REPO_ARCH="$FEED/armv7"
          PRIVATE_KEY="$RUNNER_TEMP/apk-keys/developer.rsa"
          test -s "$INDEX"

          tar -tzf "$INDEX" | grep '^\.SIGN\.RSA\.' >/dev/null

          # Signed metadata binds the index and every published APK to this
          # repository key. Carry the sequence forward to prevent feed rollback.
          PREVIOUS="$GITHUB_WORKSPACE/existing-feed/preview/armv7/feed.json"
          SEQUENCE=1
          if [[ -f "$PREVIOUS" ]]; then
            PREVIOUS_SEQUENCE="$(jq -er '.sequence | numbers' "$PREVIOUS")"
            SEQUENCE="$((PREVIOUS_SEQUENCE + 1))"
          fi

          ISSUED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          EXPIRES="$(date -u -d '+30 days' +'%Y-%m-%dT%H:%M:%SZ')"
          INDEX_SIZE="$(stat -c '%s' "$INDEX")"
          INDEX_SHA256="$(sha256sum "$INDEX" | cut -d ' ' -f 1)"

          PACKAGES="$RUNNER_TEMP/feed-packages.json"
          : > "$PACKAGES"
          for APK in "$REPO_ARCH"/couch-integration-*.apk; do
            [[ -f "$APK" ]] || continue
            APK_NAME="$(basename "$APK")"
            APK_VERSION="${APK_NAME#couch-integration-firetv-}"
            APK_VERSION="${APK_VERSION%-r0.apk}"
            APK_SIZE="$(stat -c '%s' "$APK")"
            APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"

            jq -n \
              --arg id firetv \
              --arg version "$APK_VERSION" \
              --arg apk "$APK_NAME" \
              --argjson size "$APK_SIZE" \
              --arg sha256 "$APK_SHA256" \
              '{id:$id,version:$version,apk:$apk,size:$size,sha256:$sha256,protocol_version:3,min_core_protocol_version:3}' \
              >> "$PACKAGES"
          done

          # A signed feed with no package records is never publishable.
          jq -s 'if length > 0 then . else error("no Fire TV APKs in feed") end' \
            "$PACKAGES" > "$RUNNER_TEMP/feed-packages-array.json"
          jq -n \
            --arg channel preview \
            --argjson sequence "$SEQUENCE" \
            --arg issued "$ISSUED" \
            --arg expires "$EXPIRES" \
            --arg index_path APKINDEX.tar.gz \
            --argjson index_size "$INDEX_SIZE" \
            --arg index_sha256 "$INDEX_SHA256" \
            --slurpfile packages "$RUNNER_TEMP/feed-packages-array.json" \
            '{schema:1,channel:$channel,sequence:$sequence,issued:$issued,expires:$expires,index:{path:$index_path,size:$index_size,sha256:$index_sha256},packages:$packages[0]}' \
            > "$REPO_ARCH/feed.json"

          openssl dgst -sha256 -sign "$PRIVATE_KEY" \
            -out "$REPO_ARCH/feed.json.sig" "$REPO_ARCH/feed.json"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/apk-keys/developer.rsa.pub" \
            -signature "$REPO_ARCH/feed.json.sig" "$REPO_ARCH/feed.json"

          echo "Signed repository index and metadata:"
          sha256sum "$INDEX" "$REPO_ARCH/feed.json" "$REPO_ARCH/feed.json.sig"
          ls -lh "$REPO_ARCH"

      - name: Publish package feed to GitHub Pages
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: couch-integration-firetv/build/repository
          destination_dir: .
          commit_message: "Publish Fire TV integration feed"

      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: couch-integration-firetv/build/integrations/couch-integration-firetv-${{ steps.version.outputs.version }}-r0.apk
