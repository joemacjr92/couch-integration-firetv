name: Fire TV package admission

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out Fire TV integration
        uses: actions/checkout@v4
        with:
          path: couch-integration-firetv

      - name: Check out pinned Couch SDK
        uses: actions/checkout@v4
        with:
          repository: Couch-OS/couch
          ref: e7fc36cd90faa6d6b2e3e8a733c28a3fed833d81
          path: couch-sdk-reference

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path "$GITHUB_WORKSPACE/couch-integration-firetv/Cargo.toml" --all -- --check

      - name: Run Couch executable admission test
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/couch-sdk-reference/clients"
          cargo test --locked \
            --manifest-path "$GITHUB_WORKSPACE/couch-integration-firetv/Cargo.toml" \
            --test admission
