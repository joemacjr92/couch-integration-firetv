[package]
name = "couch-integration-firetv"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Couch integration for compatible Amazon Fire TV devices"

# Pin both Couch crates to the same immutable SDK revision used by release CI.
[workspace]

[lib]
name = "couch_firetv"
path = "src/lib.rs"

[[bin]]
name = "couch-plugin-firetv"
path = "src/bin/couch-plugin-firetv.rs"

[dependencies]
couch-sdk = { git = "https://github.com/Couch-OS/couch.git", rev = "e7fc36cd90faa6d6b2e3e8a733c28a3fed833d81" }
couch-plugin = { git = "https://github.com/Couch-OS/couch.git", rev = "e7fc36cd90faa6d6b2e3e8a733c28a3fed833d81" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
